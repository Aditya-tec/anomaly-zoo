name: fuzz

# Fuzzing (spec 9.5) and the long property campaign (spec 9.3), on demand and weekly.
# Run it by hand with a longer budget, for example fuzztime 60m for AC9.2:
# Actions tab > fuzz > Run workflow > fuzztime: 60m.

on:
  schedule:
    - cron: "17 5 * * 3" # weekly, Wednesdays 05:17 UTC, default 5m per target
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Time per fuzz target, e.g. 5m, 60m, 2h (go test -fuzztime)"
        required: false
        default: "5m"
      schedules:
        description: "Random schedules per level for the property campaign"
        required: false
        default: "200000"

permissions: {}

concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: FuzzParse
            package: ./engine/dsl
          - target: FuzzRun
            package: ./engine/run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Fuzz
        env:
          # Passed through the environment, never interpolated into the script.
          FUZZTIME: ${{ github.event.inputs.fuzztime || '5m' }}
          TARGET: ${{ matrix.target }}
          PACKAGE: ${{ matrix.package }}
        run: |
          case "$FUZZTIME" in
            *[!0-9smh]*|'') echo "fuzztime must look like 5m, 60m or 2h"; exit 1 ;;
          esac
          go test -run '^$' -fuzz "^${TARGET}\$" -fuzztime "$FUZZTIME" "$PACKAGE"

      # A failing input is written under testdata/fuzz/; keep it so it can be committed as a regression seed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-failures-${{ matrix.target }}
          path: engine/**/testdata/fuzz
          retention-days: 30

  property:
    name: property campaign ${{ matrix.level }}
    runs-on: ubuntu-latest
    timeout-minutes: 345
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        level: [RU, RC, SI, SER]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Property tests, many schedules, seeds from 1,000,000
        env:
          SCHEDULES: ${{ github.event.inputs.schedules || '200000' }}
          LEVEL: ${{ matrix.level }}
        run: |
          case "$SCHEDULES" in
            ''|*[!0-9]*) echo "schedules must be a number"; exit 1 ;;
          esac
          AZOO_PROP_N="$SCHEDULES" AZOO_PROP_SEED=1000000 go test -count=1 -timeout 330m -run "^TestProperties${LEVEL}\$" ./engine/run
