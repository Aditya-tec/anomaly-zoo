name: ci

on:
  pull_request:
  push:
    branches: [main]

# No token permissions by default; each job opts in to exactly what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go
    runs-on: ubuntu-latest # standard 2-core runner; larger runners are billed even on public repos
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod # honours the `toolchain` line
          cache: false # the root module has no dependencies, hence no go.sum to key on

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          "$(go env GOPATH)/bin/staticcheck" ./...

      # The engine is single-threaded by design, so -race mostly guards the
      # tooling. -short keeps the property tests at 1,000 schedules per level (and 200
      # seeds in the unsampled schema/digest test) under the
      # race detector (about 10x slower); the full 20,000 run follows without it.
      - name: go test -race -short
        run: go test -race -short -count=1 ./...

      - name: go test (full property runs, 20,000 schedules per level)
        run: go test -count=1 ./...

      # Release check (spec §9.4): the committed PostgreSQL report must describe
      # the engine that is being released.
      - name: conformance.json engineVersion equals azoo version
        run: |
          want="$(go run ./cmd/azoo version)"
          got="$(jq -r .engineVersion web/public/conformance.json)"
          echo "azoo version: $want; conformance.json engineVersion: $got"
          test -n "$want" && test "$want" = "$got"

  conformance:
    name: conformance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CONFORMANCE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      AZOO_REQUIRE_DB: "1" # a skipped DB test must fail this job
    defaults:
      run:
        working-directory: conformance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: conformance/go.mod
          cache-dependency-path: conformance/go.sum

      - name: go vet
        run: go vet ./...

      - name: Harness tests and SELECT 1 against the postgres:16 service container
        run: |
          set -o pipefail
          go test -count=1 -v ./... | tee "$RUNNER_TEMP/conformance.txt"
          grep -q -- '--- PASS: TestPostgresSelect1' "$RUNNER_TEMP/conformance.txt"
          grep -i 'server_version' "$RUNNER_TEMP/conformance.txt"

      # AC8.1: the harness runs against the service container and writes the
      # report (engineVersion, postgresVersion). The exit status is non-zero when
      # a canned outcome differs undocumented, a mismatch does not reproduce
      # without a waiter race, or a history is not serializable.
      - name: Conformance harness (canned scenarios, then 500 random schedules per level)
        run: |
          set -o pipefail
          go run ./cmd/azoo-conformance -random 500 -workers 4 -show 100 -out "$RUNNER_TEMP/conformance.json" | tee "$RUNNER_TEMP/conformance-report.txt"

      - name: Report is for this engine version
        run: |
          want="$(cd .. && go run ./cmd/azoo version)"
          got="$(jq -r .engineVersion "$RUNNER_TEMP/conformance.json")"
          pg="$(jq -r .postgresVersion "$RUNNER_TEMP/conformance.json")"
          echo "engine $want; report engine $got; postgres $pg"
          test "$want" = "$got" && test -n "$pg"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: conformance-report
          path: |
            ${{ runner.temp }}/conformance.json
            ${{ runner.temp }}/conformance-report.txt
          retention-days: 30

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install (lockfile only, no install scripts)
        run: npm ci --ignore-scripts

      - name: Lint (includes the no-hard-coded-outcome and no-innerHTML rules)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build (static export, per-page CSP injection and verification, no-engine check)
        run: npm run build

      - name: Size budgets
        run: npm run size

      - name: Dependency audit (production, high and above)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Install Chromium, Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Playwright (journeys, keyboard-only, axe, responsive, CSP) in three browsers
        run: npx playwright test

      - name: Lighthouse (mobile profile; performance, accessibility, best practices, SEO budgets)
        run: npm run lighthouse

      - name: Deployed-URL checker against the local server with the real headers
        run: |
          node scripts/serve.mjs 4173 &
          sleep 3
          node scripts/check-deployed.mjs http://127.0.0.1:4173

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: web-e2e-diagnostics
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
